name: Free Disk Space (Ubuntu)
on: push

jobs:
  free-disk-space:
    runs-on: ubuntu-latest
    steps:
      - name: Check Disk Hien tai
        run: |
          df -h

      - name: Free Disk Space
        uses: khoinguyen455/Optimer-Disk-SPace@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Check disk
        run: |
          df -h
